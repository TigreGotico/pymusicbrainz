[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymusicbrainz"
dynamic = ["version"]
description = "Python metadata client for MusicBrainz (web service + full data dumps)"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests",
    "unblock_requests",
]

[project.optional-dependencies]
anon = ["anon_requests"]
stealth = ["curl-cffi"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/TigreGotico/pymusicbrainz"

[tool.setuptools.dynamic]
version = { attr = "pymusicbrainz.version.__version__" }

[tool.setuptools.packages.find]
include = ["pymusicbrainz*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the network (deselect with '-m \"not live\"')",
]
